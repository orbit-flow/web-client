<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitFlow Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 디자인 시스템 규격(크기·간격·모서리·글자)만 따르고 색은 회색 와이어 톤으로 둔다 */
  :root{
    --w:#FFFFFF; --s1:#F7F7F7; --s2:#EFEFEF; --s3:#E2E2E2; --b1:#E2E2E2; --b2:#C9C9C9;
    --t1:#1C1C1C; --t2:#575757; --t3:#7A7A7A; --t4:#A3A3A3; --act:#3F3F3F; --act-h:#2A2A2A; --tint:#ECECEC;
    --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px;
    --sans:"Figtree","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/24px var(--sans);color:var(--t1);background:#E6E6E6;display:flex;word-break:keep-all;-webkit-font-smoothing:antialiased}

  /* ---------- viewer ---------- */
  .index{width:260px;flex:none;height:100vh;overflow:auto;background:var(--w);border-right:1px solid var(--b2);padding:16px 10px}
  .index h1{font-size:15px;line-height:22px;margin:0 8px 2px}
  .index .sub{color:var(--t3);font-size:12px;line-height:16px;margin:0 8px 14px}
  .index h2{font-size:11px;line-height:16px;letter-spacing:.08em;color:var(--t3);margin:16px 8px 4px;font-weight:700}
  .index a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--t1);text-decoration:none;font-size:13px;line-height:20px}
  .index a small{color:var(--t4);font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .index a:hover{background:var(--s2)}
  .index a.on{background:var(--t1);color:#fff}
  .index a.on small{color:var(--b2)}
  .stage{flex:1;height:100vh;overflow:auto;padding:20px 24px 40px;display:flex;gap:20px;align-items:flex-start}
  .stage-main{flex:1;min-width:0}
  .stage-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .stage-head h3{margin:0;font-size:20px;line-height:28px}
  .stage-head code{color:var(--t3);font-size:12px}
  .stage-head .r{margin-left:auto;display:flex;gap:10px;align-items:center}
  .hint{color:var(--t3);font-size:11px}
  .fit{position:relative}
  .frame{background:var(--w);border:1px solid var(--b2);border-radius:8px;overflow:hidden;transform-origin:0 0;position:absolute;top:0;left:0;filter:grayscale(1)}
  .frame.desk{width:1440px}
  .frame.mob{width:max-content;background:transparent;border:0;display:flex;gap:40px;padding:4px}
  .notes{width:300px;flex:none;background:var(--w);border:1px solid var(--b2);border-radius:8px;padding:14px 16px;position:sticky;top:0}
  .notes h4{margin:0 0 8px;font-size:13px}
  .notes ol{margin:0;padding:0;list-style:none}
  .notes li{display:flex;gap:8px;margin:0 0 10px;font-size:12.5px;line-height:18px}
  .notes li .n{flex:none;margin-top:1px}
  .notes code{font-size:11px;color:var(--t3);display:block;margin-top:2px;word-break:break-all}
  .notes .q{margin-top:14px;padding-top:12px;border-top:1px dashed var(--b2)}
  .notes .q b{display:block;font-size:12px;margin-bottom:4px}
  .notes .q p{margin:0 0 6px;font-size:12px;line-height:18px;color:var(--t2)}
  @media (max-width:1250px){.stage{flex-direction:column}.notes{width:100%;position:static}.stage-main{width:100%}}

  /* ---------- primitives (DS 규격) ---------- */
  .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#111;color:#fff;font:700 10.5px/1 var(--sans);font-style:normal;vertical-align:middle;margin:0 4px;flex:none}
  .ph{position:relative;background:repeating-linear-gradient(135deg,var(--s2) 0 6px,var(--s1) 6px 12px);border:1px dashed var(--b2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--t3);font-size:12px;line-height:16px;text-align:center}
  .ln{height:10px;background:var(--s3);border-radius:var(--r-xs);margin:6px 0}
  .ln.d{background:var(--b2)}
  .ic{display:inline-block;flex:none;border-radius:var(--r-xs);background:var(--s3);vertical-align:middle}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--b2);border-radius:var(--r-sm);background:var(--w);font-size:15px;font-weight:600;white-space:nowrap;color:var(--t1)}
  .btn.p{background:var(--act);border-color:var(--act);color:#fff}
  .btn.s{background:transparent;border-color:var(--act);color:var(--act)}
  .btn.g{border-color:transparent;background:transparent}
  .btn.d{background:#5a5a5a;border-color:#5a5a5a;color:#fff}
  .btn.sm{height:32px;padding:0 12px;font-size:13px;gap:6px}
  .btn.lg{height:48px;padding:0 20px;font-size:16px}
  .btn.w{width:100%}
  .btn.dash{border-style:dashed;color:var(--t3);font-weight:500}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);position:relative;flex:none;color:var(--t2);font-size:16px}
  .ibtn.sm{width:32px;height:32px;font-size:14px}
  .ibtn.o{border:1px solid var(--b2);background:var(--w)}
  .ibtn i.dotb{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:999px;background:#555}
  .inp{height:40px;border:1px solid var(--b2);border-radius:var(--r-sm);background:var(--w);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--t4);font-size:15px;white-space:nowrap;overflow:hidden}
  .inp.sm{height:32px;font-size:13px}
  .inp.lg{height:48px}
  .inp.ta{height:auto;min-height:96px;align-items:flex-start;padding-top:10px}
  .lbl{font-size:13px;line-height:20px;font-weight:600;margin:12px 0 6px}
  .hnt{font-size:12px;line-height:16px;color:var(--t3);margin-top:6px}
  .av{position:relative;display:inline-flex;flex:none;align-items:center;justify-content:center;border-radius:var(--r-sm);background:repeating-linear-gradient(135deg,var(--s2) 0 6px,var(--s1) 6px 12px);border:1px dashed var(--b2)}
  .av.big{border-radius:var(--r-md)}
  .av .lv{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:16px;padding:0 4px;border-radius:var(--r-xs);background:var(--act);color:#fff;font:800 10px/16px var(--sans);text-align:center;box-shadow:0 0 0 2px #fff}
  .av.big .lv{min-width:28px;height:20px;font-size:11px;line-height:20px}
  .badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-xs);background:var(--s2);color:var(--t2);font-size:12px;font-weight:700;white-space:nowrap;line-height:1}
  .badge.sm{height:18px;padding:0 6px;font-size:11px}
  .badge.solid{background:var(--act);color:#fff}
  .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--act);color:#fff;font:700 11px/1 var(--sans);font-style:normal}
  .tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--b1);border-radius:var(--r-sm);background:var(--w);font-size:13px;font-weight:500;white-space:nowrap}
  .tag.sm{height:24px;font-size:12px;padding:0 8px}
  .tag.on{border-color:var(--act);background:var(--tint)}
  .cdot{display:inline-block;width:8px;height:8px;border-radius:var(--r-xs);background:var(--t4);flex:none}
  .cb{display:inline-block;width:20px;height:20px;border:1.5px solid var(--t4);border-radius:6px;flex:none;background:var(--w)}
  .cb.on{background:var(--act);border-color:var(--act)}
  .cb.s{width:16px;height:16px;border-radius:5px}
  .cb.dash{border-style:dashed}
  .rad{display:inline-block;width:20px;height:20px;border:1.5px solid var(--t4);border-radius:50%;flex:none}
  .rad.on{border:6px solid var(--act)}
  .sw{display:inline-block;width:44px;height:26px;border-radius:var(--r-sm);background:var(--b2);position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--r-xs);background:#fff}
  .sw.on{background:var(--act)}.sw.on::after{left:21px}
  .segc{display:inline-flex;gap:2px;padding:2px;background:var(--s2);border-radius:var(--r-sm)}
  .segc span{white-space:nowrap;height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-xs);font-size:13px;font-weight:500;color:var(--t2);cursor:pointer}
  .segc span.on{background:var(--w);color:var(--t1);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .segc.full{display:flex}.segc.full span{flex:1}
  .segc.sm span{height:28px;font-size:12px}
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--b1)}
  .tabs span{height:44px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tabs span.on{color:var(--t1);font-weight:700;border-color:var(--t1)}
  .tabs span em{font-style:normal;font-size:12px;font-weight:700;color:var(--t3)}
  .prog{height:6px;border-radius:var(--r-xs);background:var(--s3);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--act);border-radius:var(--r-xs)}
  .proglbl{display:flex;justify-content:space-between;font-size:12px;line-height:16px;font-weight:600;margin-bottom:6px}
  .card{background:var(--w);border:1px solid var(--b1);border-radius:var(--r-md);padding:20px}
  .card.sub{background:var(--s1);border-color:transparent}
  .card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card-h b{font-size:15px}
  .card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .row{display:flex;gap:8px;align-items:center}
  .col{display:flex;flex-direction:column;gap:8px}
  .f1{flex:1;min-width:0}
  .sp{flex:1}
  .muted{color:var(--t3)}
  .t2{color:var(--t2)}
  .small{font-size:13px;line-height:20px}
  .cap{font-size:12px;line-height:16px}
  .over{font-size:11px;line-height:16px;letter-spacing:.08em;font-weight:700;color:var(--t3)}
  .hr{height:1px;background:var(--b1);margin:16px 0}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .center{display:flex;align-items:center;justify-content:center}
  .x{text-decoration:line-through;color:var(--t3)}
  table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:20px}
  table.t th{text-align:left;color:var(--t3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--b2);background:var(--s1)}
  table.t td{padding:10px 12px;border-bottom:1px solid var(--b1)}
  .h1{font-size:26px;line-height:34px;font-weight:700;letter-spacing:-.01em;margin:0}
  .h3{font-size:20px;line-height:28px;font-weight:700;margin:0}
  .list{border:1px solid var(--b1);border-radius:var(--r-md);overflow:hidden;background:var(--w)}
  .lrow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:56px;border-bottom:1px solid var(--b1)}
  .lrow:last-child{border-bottom:0}
  .lrow .tt{font-size:15px;line-height:22px;font-weight:500}
  .lrow .ds{font-size:13px;line-height:18px;color:var(--t2)}
  .lrow .val{font-size:14px;color:var(--t2)}
  .chev{color:var(--t4)}

  /* TaskItem (+ 하위 할 일) */
  .task{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--b1);background:var(--w)}
  .task:last-child{border-bottom:0}
  .task .tm{width:44px;flex:none;font:600 13px/20px var(--mono);color:var(--t1)}
  .task .tm small{display:block;font-weight:500;color:var(--t3)}
  .task .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .task .tt1{font-size:15px;line-height:22px;font-weight:500}
  .task .meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;line-height:16px;color:var(--t2)}
  .task .meta span{display:inline-flex;align-items:center;gap:4px}
  .task.pv{background:var(--s1)}
  .task.pv .tt1{color:var(--t2)}
  .kids{border-left:2px solid var(--b1);padding-left:10px;display:flex;flex-direction:column}
  .kids-h{font-size:12px;line-height:16px;font-weight:600;color:var(--t2);padding:2px 0;cursor:pointer}
  .kid{display:flex;align-items:center;gap:8px;height:30px;font-size:13px}
  .kid .hd{color:var(--b2);font-size:10px;letter-spacing:-2px}
  .kid.add{color:var(--t3)}

  /* desktop shell */
  .app{display:flex;min-height:820px}
  .side{width:232px;flex:none;background:var(--s1);border-right:1px solid var(--b1);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
  .logo{font-weight:800;font-size:17px;padding:4px 8px 16px;display:flex;align-items:center;gap:8px}
  .logo i{width:22px;height:22px;border-radius:50%;border:3px solid var(--t2);flex:none}
  .fold{margin-left:auto;width:28px;height:28px;border:1px solid var(--b2);border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);background:var(--w);cursor:pointer;flex:none}
  .navi{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--r-sm);color:var(--t2);font-size:15px;font-weight:500;cursor:pointer}
  .navi:hover{background:var(--s2)}
  .navi.on{background:var(--s3);color:var(--t1);font-weight:700}
  .navi .cnt{margin-left:auto}
  .side .grp{padding:16px 12px 4px}
  .side-pt{display:flex;gap:8px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--b1);margin-top:8px}
  .side-pt+.me{border-top:0;margin-top:0}
  .frame.tab .ndrop{left:76px!important}
  .me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--b1);margin-top:8px;cursor:pointer}
  .app.mini .side{width:64px;padding:16px 10px;align-items:center}
  .app.mini .lt{display:none}
  .app.mini .logo{flex-direction:column;gap:12px;padding:4px 0 16px}
  .app.mini .fold{margin-left:0}
  .app.mini .navi{justify-content:center;position:relative;padding:0;width:44px}
  .app.mini .navi .cnt{position:absolute;top:2px;right:0;margin:0}
  .app.mini .grp{font-size:0;height:1px;background:var(--b1);padding:0;margin:12px 4px;width:36px}
  .app.mini .me{padding:12px 0 0;justify-content:center}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:64px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;padding:0 40px}
  .pbal{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border-radius:var(--r-sm);background:var(--s2);font-size:14px;font-weight:800}
  .pbal .coin{width:16px;height:16px;border-radius:50%;border:2px solid var(--t1)}
  .pbal .add{width:24px;height:24px;border-radius:var(--r-xs);background:var(--act);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
  .pbal.na{padding-right:10px}
  .body-row{display:flex;flex:1;min-height:0}
  .content{position:relative;flex:1;min-width:0;padding:24px 40px 40px;background:var(--w)}
  .pg-h{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .pg-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
  .rpanel{width:340px;flex:none;border-left:1px solid var(--b1);background:var(--s1);display:flex;flex-direction:column}
  .rp-h{display:flex;align-items:flex-end;gap:8px;padding:8px 16px 0;border-bottom:1px solid var(--b1);background:var(--w)}
  .rp-h .tabs{border:0}
  .rp-h .fold{margin-bottom:8px}
  .rp-b{padding:12px 0;display:flex;flex-direction:column;gap:12px}
  .rpanel.closed{width:52px;align-items:center;padding:16px 0;gap:16px}
  .vt{writing-mode:vertical-rl;display:flex;align-items:center;gap:6px;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer}
  .vt.on{color:var(--t1);font-weight:800}
  .grp-h{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;font-weight:700;height:28px}

  /* dashboard */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal .w{font-size:11px;color:var(--t3);font-weight:600;line-height:20px}
  .cd{height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:13px;gap:2px;font-weight:500}
  .cd i{display:block;width:4px;height:4px;border-radius:50%;background:var(--t4)}
  .cd i.no{visibility:hidden}
  .cd.out{color:var(--b2)}
  .cd.inwk{background:var(--s2);border-radius:0}
  .cd.on{background:var(--act);color:#fff;border-radius:var(--r-sm)}.cd.on i{background:#fff}
  .cd.today{box-shadow:inset 0 0 0 1.5px var(--t2)}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .wk-col{border:1px solid var(--b1);border-radius:var(--r-md);background:var(--s1);min-height:420px;display:flex;flex-direction:column;min-width:0}
  .wk-col.on{border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
  .wk-h{padding:8px 10px;border-bottom:1px solid var(--b1);display:flex;align-items:baseline;gap:6px;cursor:pointer}
  .wk-h b{font-size:17px}
  .wk-b{padding:6px;display:flex;flex-direction:column;gap:6px}
  .mini{background:var(--w);border:1px solid var(--b1);border-radius:var(--r-sm);padding:6px 8px;font-size:12px;line-height:16px}
  .mini.pv{background:var(--s1);border-style:dashed}
  .mini .tm{font:600 11px/16px var(--mono);color:var(--t2)}
  .mini .kc{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .month{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--b1);border-left:1px solid var(--b1);border-radius:var(--r-md);overflow:hidden}
  .month>div{border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);min-height:100px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:11px;min-width:0;cursor:pointer}
  .month>.mh{min-height:0;text-align:center;color:var(--t3);background:var(--s1);padding:6px;cursor:default;font-weight:600}
  .month .dn{font-weight:700;font-size:12px}
  .month>.out{background:var(--s1);color:var(--b2)}
  .month>.sel{box-shadow:inset 0 0 0 2px var(--act)}
  .mc{display:block;background:var(--s2);border-radius:var(--r-xs);padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc.done{color:var(--t3);text-decoration:line-through}
  .mc.pv{background:transparent;border:1px dashed var(--b2)}

  /* overlays */
  .scrim{position:absolute;inset:0;background:rgba(20,20,20,.48)}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:480px;background:var(--w);border-left:1px solid var(--b2);padding:20px 24px;display:flex;flex-direction:column;overflow:hidden}
  .dialog{position:absolute;background:var(--w);border-radius:var(--r-md);box-shadow:0 2px 6px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.18);overflow:hidden}
  .toast{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,.9);border:1px solid var(--b1);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.1);font-size:14px;line-height:20px}

  /* 인증: 흰 바탕 전체 화면 모달. .state = 와이어에서 여러 단계를 나란히 펼칠 때의 구분선 */
  .state{border:1px dashed var(--b2);border-radius:var(--r-md);padding:24px}
  .aform{width:100%;max-width:400px;margin:0 auto}
  .astates{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
  .astates>.state{width:450px;max-width:100%}
  /* chat */
  .bubble{max-width:70%;padding:8px 12px;border-radius:var(--r-md);background:var(--s2);font-size:15px;line-height:22px}
  .bubble .ln{max-width:100%}
  .bubble.me{background:var(--act);color:#fff;margin-left:auto}
  .bubble.me .ln{background:#777}
  .dmsg{display:flex;gap:12px;padding:4px 20px}
  .dmsg .meta{display:flex;gap:8px;align-items:baseline}
  .dmsg .meta b{font-size:15px}
  .dmsg.cont{padding-left:72px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px;margin:12px 20px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--b1)}
  .chan{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r-sm);color:var(--t2);font-size:15px}
  .chan.on{background:var(--s3);color:var(--t1);font-weight:700}
  .chan .cnt{margin-left:auto}

  /* auth */
  .otp{display:flex;gap:8px}
  .otp span{width:44px;height:52px;border:1px solid var(--b2);border-radius:var(--r-sm);background:var(--w)}

  /* mobile */
  .phone-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
  .phone-cap{font-size:13px;font-weight:700;color:var(--t2)}
  .phone{position:relative;width:375px;height:812px;border-radius:44px;overflow:hidden;background:var(--w);box-shadow:0 0 0 10px #1c1c1c,0 0 0 11px #4a4a4a;display:flex;flex-direction:column;margin:11px}
  .sbar{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:15px;font-weight:700}
  .sbar i{display:inline-block;width:56px;height:12px;border-radius:3px;background:var(--b2)}
  .mtop{flex:none;display:flex;align-items:center;gap:4px;min-height:52px;padding:0 8px 0 16px}
  .mtop h1{margin:0;flex:1;font-size:17px;line-height:24px;font-weight:700}
  .mtop.lg h1{font-size:26px;line-height:34px;letter-spacing:-.01em}
  .mtop.back{padding-left:4px}
  .mbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .mpad{padding:0 16px}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding-bottom:20px;background:rgba(255,255,255,.86);border-top:1px solid var(--b1);display:flex}
  .tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--t3);position:relative}
  .tabbar span .ic{width:24px;height:24px}
  .tabbar span.on{color:var(--t1);font-weight:700}
  .tabbar span.on .ic{background:var(--t2)}
  .tabbar span i.dotb{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:999px;background:#555}
  .fab{position:absolute;right:16px;bottom:100px;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.18)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--w);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 16px 36px;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--b2);margin:0 auto 12px}
  .mstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .mstrip div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:var(--r-sm);font-size:11px;color:var(--t3)}
  .mstrip div b{font-size:15px;color:var(--t1)}
  .mstrip div.on{background:var(--act);color:#ddd}.mstrip div.on b{color:#fff}
  .mstrip i{width:4px;height:4px;border-radius:50%;background:var(--t4)}
  .mstrip div.on i{background:#fff}
  .desk-only{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px;text-align:center}

  /* tablet (768–1023): 6열 · 거터/마진 24 */
  .frame.tab{width:768px}
  .main{position:relative}
  .frame.tab .content{padding:24px 24px 40px}
  .frame.tab .top{padding:0 24px}
  .frame.tab .g3,.frame.tab .g4{grid-template-columns:repeat(2,1fr)}
  .frame.tab .g4.t3{grid-template-columns:repeat(3,1fr)}
  .frame.tab .g2.stk{grid-template-columns:1fr}
  .frame.tab .split{flex-direction:column;align-items:stretch!important}
  .frame.tab .split>*{width:auto!important;max-width:none!important}
  .frame.tab .split>.first{order:-1}
  .frame.tab .tab-hide{display:none!important}
  .tab-only{display:none}
  .frame.tab .tab-only{display:block}
  .frame.tab .chat-list{width:239px!important}
  .frame.tab .chatwrap{margin:-24px -24px -40px!important}
  .frame.tab .lp{padding-left:24px!important;padding-right:24px!important}
  .frame.tab .lpm{margin-left:24px!important;margin-right:24px!important}
  .frame.tab .dialog.cdlg{left:50%!important;transform:translateX(-50%)}
  .frame.tab .postwrap{height:1260px!important}
  .frame.tab .dialog.pd{left:24px!important;right:24px;width:auto!important}
  .frame.tab .dialog.pc{left:184px!important;top:700px!important;width:400px!important}
  .rpanel.ov{position:absolute;right:0;top:0;bottom:0;z-index:6;box-shadow:-8px 0 32px rgba(0,0,0,.16)}
  .frame.tab .gridov{left:24px;right:24px;grid-template-columns:repeat(6,1fr);column-gap:24px}
  /* 열 단위 배치: 데스크톱 sN/stN · 태블릿 tsN/tstN · 모바일 msN, 중첩 그리드는 nN/tnN/mnN */
  .gr{--n:12;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:24px;row-gap:24px;align-items:start}
  .gr>*{min-width:0;grid-column-end:span var(--n)}
  .frame.tab .gr{--n:6}
  .frame.tab .gr>*{grid-column-start:auto;grid-column-end:span var(--n)}
  .phone .gr{--n:4;column-gap:16px;row-gap:16px}
  .phone .gr>*{grid-column-start:auto;grid-column-end:span var(--n)}
  .frame.tab .gr>.first{order:-1}
  .gr.n1{--n:1} .gr>.s1{grid-column-end:span 1} .gr>.st1{grid-column-start:1}
  .gr.n2{--n:2} .gr>.s2{grid-column-end:span 2} .gr>.st2{grid-column-start:2}
  .gr.n3{--n:3} .gr>.s3{grid-column-end:span 3} .gr>.st3{grid-column-start:3}
  .gr.n4{--n:4} .gr>.s4{grid-column-end:span 4} .gr>.st4{grid-column-start:4}
  .gr.n5{--n:5} .gr>.s5{grid-column-end:span 5} .gr>.st5{grid-column-start:5}
  .gr.n6{--n:6} .gr>.s6{grid-column-end:span 6} .gr>.st6{grid-column-start:6}
  .gr.n7{--n:7} .gr>.s7{grid-column-end:span 7} .gr>.st7{grid-column-start:7}
  .gr.n8{--n:8} .gr>.s8{grid-column-end:span 8} .gr>.st8{grid-column-start:8}
  .gr.n9{--n:9} .gr>.s9{grid-column-end:span 9} .gr>.st9{grid-column-start:9}
  .gr.n10{--n:10} .gr>.s10{grid-column-end:span 10} .gr>.st10{grid-column-start:10}
  .gr.n11{--n:11} .gr>.s11{grid-column-end:span 11} .gr>.st11{grid-column-start:11}
  .gr.n12{--n:12} .gr>.s12{grid-column-end:span 12} .gr>.st12{grid-column-start:12}
  .frame.tab .gr.tn1{--n:1} .frame.tab .gr>.ts1{grid-column-end:span 1} .frame.tab .gr>.tst1{grid-column-start:1}
  .frame.tab .gr.tn2{--n:2} .frame.tab .gr>.ts2{grid-column-end:span 2} .frame.tab .gr>.tst2{grid-column-start:2}
  .frame.tab .gr.tn3{--n:3} .frame.tab .gr>.ts3{grid-column-end:span 3} .frame.tab .gr>.tst3{grid-column-start:3}
  .frame.tab .gr.tn4{--n:4} .frame.tab .gr>.ts4{grid-column-end:span 4} .frame.tab .gr>.tst4{grid-column-start:4}
  .frame.tab .gr.tn5{--n:5} .frame.tab .gr>.ts5{grid-column-end:span 5} .frame.tab .gr>.tst5{grid-column-start:5}
  .frame.tab .gr.tn6{--n:6} .frame.tab .gr>.ts6{grid-column-end:span 6} .frame.tab .gr>.tst6{grid-column-start:6}
  .phone .gr.mn1{--n:1} .phone .gr>.ms1{grid-column-end:span 1}
  .phone .gr.mn2{--n:2} .phone .gr>.ms2{grid-column-end:span 2}
  .phone .gr.mn3{--n:3} .phone .gr>.ms3{grid-column-end:span 3}
  .phone .gr.mn4{--n:4} .phone .gr>.ms4{grid-column-end:span 4}
  /* grid overlay (G) */
  .gridov{position:absolute;top:0;bottom:0;left:40px;right:40px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;pointer-events:none;z-index:50}
  .gridov i{background:rgba(70,70,70,.08);border-left:1px solid rgba(70,70,70,.25);border-right:1px solid rgba(70,70,70,.25)}
  .phone .gridov{left:16px;right:16px;grid-template-columns:repeat(4,1fr);column-gap:16px}
  /* layout rules page */
  .bp{border:1px solid var(--b2);border-radius:var(--r-md);overflow:hidden;background:var(--w);display:flex;flex-direction:column}
  .bp-h{padding:10px 14px;border-bottom:1px solid var(--b1);font-weight:700;font-size:13px;background:var(--s1)}
  .zone{border:1px dashed var(--b2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t2);text-align:center;background:var(--s1)}
</style>
</head>
<body>
<nav class="index" id="index"></nav>
<div class="stage">
  <div class="stage-main">
    <div class="stage-head"><h3 id="title"></h3><code id="path"></code>
      <span class="r"><span class="segc sm" id="mode"><span data-mode="d" class="on">데스크톱 1440</span><span data-mode="t">태블릿 768</span><span data-mode="m">모바일 375</span></span><span class="btn sm" id="gridbtn">그리드</span><span class="hint">← → 페이지 · D/T/M 크기 · G 그리드</span></span></div>
    <div class="fit" id="fit"><div class="frame desk" id="frame"></div></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ===== primitives ===== */
const ph=(label='',h=80,st='')=>`<div class="ph" style="height:${h}px;${st}">${label}</div>`;
const ln=(w='100%',cls='')=>`<div class="ln ${cls}" style="width:${w}"></div>`;
const lns=(...ws)=>ws.map(w=>ln(w)).join('');
const ic=(s=20,st='')=>`<span class="ic" style="width:${s}px;height:${s}px;${st}"></span>`;
// k: p 주요 · s 보조(외곽선) · g 고스트 · d 위험 · sm/lg 크기 · w 가득 · dash 점선
const btn=(t,k='')=>`<span class="btn ${k}">${t}</span>`;
const ibtn=(g='',k='',dot)=>`<span class="ibtn ${k}">${g||ic(20)}${dot?'<i class="dotb"></i>':''}</span>`;
const inp=(t,k='',st='')=>`<div class="inp ${k}" style="${st}">${t}</div>`;
const n=k=>`<i class="n">${k}</i>`;
const av=(s=40,lv,st='')=>`<span class="av ${s>=64?'big':''}" style="width:${s}px;height:${s}px;${st}">${lv!=null?`<i class="lv">${lv}</i>`:''}</span>`;
const badge=(t,k='')=>`<span class="badge ${k}">${t}</span>`;
const cnt=t=>`<i class="cnt">${t}</i>`;
const tag=(t,on,k='',dot=true)=>`<span class="tag ${on?'on':''} ${k}">${dot?'<i class="cdot"></i>':''}${t}</span>`;
const cb=(on,k='')=>`<span class="cb ${on?'on':''} ${k}"></span>`;
const rad=on=>`<span class="rad ${on?'on':''}"></span>`;
const sw=on=>`<span class="sw ${on?'on':''}"></span>`;
const segc=(arr,on=0,k='',go=[])=>`<span class="segc ${k}">${arr.map((t,i)=>`<span class="${i===on?'on':''}" ${go[i]?`data-go="${go[i]}"`:''}>${t}</span>`).join('')}</span>`;
const tabs=(arr,on=0,go=[],st='')=>`<div class="tabs" style="${st}">${arr.map((t,i)=>{const [l,c]=Array.isArray(t)?t:[t];return `<span class="${i===on?'on':''}" ${go[i]?`data-go="${go[i]}"`:''}>${l}${c!=null?` <em>${c}</em>`:''}</span>`}).join('')}</div>`;
const prog=(pct,label,val)=>`${label?`<div class="proglbl"><span>${label}</span><span>${val||''}</span></div>`:''}<div class="prog"><i style="width:${pct}%"></i></div>`;
const card=(body,o={})=>`<section class="card ${o.k||''}" style="${o.st||''}">${o.title?`<div class="card-h"><b>${o.title}</b>${o.right?`<span class="r">${o.right}</span>`:''}</div>`:''}${body}</section>`;
// 그리드 컨테이너와 칸: G('n8 tn6', ...), C('s4 ts3', ...)
const G=(cls,inner,st='')=>`<div class="gr ${cls}" style="${st}">${inner}</div>`;
const C=(cls,inner,st='')=>`<div class="${cls}" style="${st}">${inner}</div>`;
const field=(l,t,hint,k='')=>`<div class="lbl">${l}</div>${inp(t,k)}${hint?`<div class="hnt">${hint}</div>`:''}`;
const select=(l,t,k='')=>(l?`<div class="lbl">${l}</div>`:'')+inp(`<span class="f1" style="color:var(--t1)">${t}</span><span class="muted">▾</span>`,k);
const rep=(k,f)=>Array.from({length:k},(_,i)=>f(i)).join('');
const lrow=(title,o={})=>`<div class="lrow" ${o.go?`data-go="${o.go}"`:''}>${o.ic===false?'':ic(22)}<div class="f1"><div class="tt">${title}</div>${o.ds?`<div class="ds">${o.ds}</div>`:''}</div>${o.val?`<span class="val">${o.val}</span>`:''}${o.trail!=null?o.trail:'<span class="chev">›</span>'}</div>`;
const pbal=(amt='1,250',add=true)=>`<span class="pbal ${add?'':'na'}"><i class="coin"></i>${amt}${add?'<span class="add">＋</span>':''}</span>`;
const levelBadge=(lv=7,cur=26,req=34)=>`<div class="f1" style="min-width:0"><div class="row" style="gap:8px">${badge('Lv.'+lv,'solid')}<span class="small" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">다음 레벨까지 ${req-cur} EXP</span></div><div style="margin-top:8px">${prog(Math.round(cur/req*100))}</div><div class="cap muted" style="margin-top:4px">${cur} / ${req} EXP</div></div>`;

/* 할 일 (TaskItem + 하위 할 일) */
const kidsBlock=(k=[],open)=>{
  if(!k.length) return `<div class="kids"><div class="kid add">＋ 하위 할 일</div></div>`;
  const d=k.filter(x=>x[1]).length;
  return `<div class="kids"><div class="kids-h">${open?'▾':'▸'} 하위 할 일 ${d}/${k.length}</div>${open?k.map(([t,dn])=>`<div class="kid"><span class="hd">⋮⋮</span>${cb(dn,'s')}<span class="${dn?'x':''}">${t}</span></div>`).join('')+'<div class="kid add">＋ 하위 할 일</div>':''}</div>`;
};
// o: {t, done, time:[시작,끝], due, cat, rep, remind, kids, open, pv, who}
const task=o=>`<div class="task ${o.pv?'pv':''}" data-go="todo">
  ${o.time?`<div class="tm">${o.time[0]}<small>${o.time[1]||''}</small></div>`:''}
  ${o.pv?cb(false,'dash'):cb(o.done)}
  <div class="tb"><div class="tt1 ${o.done?'x':''}">${o.t}</div>
    <div class="meta">${o.due?`<span>${ic(13)} ${o.due}</span>`:''}${o.cat?`<span><i class="cdot"></i>${o.cat}</span>`:''}${o.rep?`<span>↻ ${o.rep}</span>`:''}${o.remind?`<span>⏰ ${o.remind}</span>`:''}${o.pv?'<span>반복 미리보기 · 체크하면 생성</span>':''}</div>
    ${o.pv?'':kidsBlock(o.kids,o.open)}</div>
  ${o.who?av(24):''}</div>`;

/* ===== desktop shell ===== */
const NAV=[['dashboard','대시보드'],['categories','카테고리 · 반복'],['timeline','타임라인'],['teams','팀'],['chat','채팅',4],['notifications','알림',3]];
const NAV2=[['avatar','아바타'],['shop','상점'],['points','포인트']];
const navItem=([id,t,b],active)=>`<a class="navi ${id===active?'on':''}" data-go="${id}">${ic(20)}<span class="lt">${t}</span>${b?cnt(b):''}</a>`;
// o.mini 좌측 접힘 · o.right 우측 패널 · o.mark 접기 버튼 번호
const TAB=()=>mode==='t';
function shell(active,body,o={}){
  if(TAB()) o={...o,mini:true};
  return `<div class="app ${o.mini?'mini':''}">
  <aside class="side">
    <div class="logo"><i></i><span class="lt">OrbitFlow</span><span class="fold">${o.mini?'»':'«'}</span>${o.mark?n(1):''}</div>
    ${NAV.map(x=>navItem(x,active)).join('')}
    <div class="grp over lt">꾸미기</div>
    ${NAV2.map(x=>navItem(x,active)).join('')}
    <div class="sp"></div>
    ${navItem(['settings','설정'],active)}
    <div class="side-pt lt">${pbal()}<span class="sp"></span>${btn('출석','sm')}</div>
    <div class="me" data-go="profile">${av(36,7)}<div class="f1 lt"><div class="small" style="font-weight:700">홍길동</div><div class="cap muted">내 프로필</div></div></div>
  </aside>
  <div class="main">
    <div class="body-row"><div class="content">${body}</div>${o.right||''}</div>
  </div></div>`;
}
// 인증 화면: 흰 바탕 전체 화면 모달 (상단 로고 · ✕ 닫기). h = 여러 단계를 펼쳐 보일 때의 높이
const authModal=body=>`<div style="min-height:820px;background:var(--w);display:flex;flex-direction:column"><div class="row lp" style="height:64px;padding:0 40px"><div class="logo" style="padding:0"><i></i>OrbitFlow</div><span class="sp"></span>${ibtn('✕')}</div><div class="lp" style="padding:56px 40px 40px">${body}</div></div>`;
const mcard=(title,body)=>`<div><h2 class="h1" style="margin-bottom:4px">${title}</h2>${body}</div>`;
/* 인증 폼: 폭 400 고정(좁으면 100%) 컴포넌트 하나를 데스크톱 · 태블릿 · 모바일이 같이 쓴다 */
const LOGIN=()=>mcard('로그인',`<div class="small muted">다시 만나서 반가워요</div>
  ${n(1)}${field('이메일','name@example.com','','lg')}${field('비밀번호','••••••••','','lg')}
  <div class="row small" style="margin:12px 0 20px"><span class="sp"></span><span class="t2" data-go="account">비밀번호를 잊었어요 ${n(2)}</span></div>
  ${btn('로그인','p lg w')}
  <div class="row cap muted" style="margin:20px 0"><div class="hr f1" style="margin:0"></div>또는 ${n(3)}<div class="hr f1" style="margin:0"></div></div>
  <div class="col">${['Google','Kakao','Naver','GitHub'].map(p=>btn(ic(18)+' '+p+'로 계속하기','lg w')).join('')}</div>
  <div class="center small" style="margin-top:20px;gap:6px"><span class="muted">계정이 없나요?</span><b data-go="signup">회원가입</b></div>`);
const SIGNUP=[
  ()=>mcard('회원가입',`<div style="margin:12px 0 4px">${prog(33)}</div><div class="over" style="margin-top:12px">1 / 3 · 이메일 인증 ${n(1)}</div>

function adminShell(active,body){
  const M=[['reports','신고 · 정지','admin-reports'],['items','아이템 · 사용자','admin-items'],['mon','모니터링 ↗','']];
  return `<div class="app ${TAB()?'mini':''}"><aside class="side"><div class="logo"><i></i><span class="lt">OrbitFlow ${badge('관리자','sm')}</span></div>
   ${M.map(([k,t,go])=>`<a class="navi ${k===active?'on':''}" ${go?`data-go="${go}"`:''}>${ic(20)}<span class="lt">${t}</span></a>`).join('')}
   <div class="sp"></div><a class="navi" data-go="dashboard">${ic(20)}<span class="lt">서비스로 돌아가기</span></a></aside>
   <div class="main"><div class="content">${body}</div></div></div>`;
}

/* ===== viewer ===== */
const $=s=>document.querySelector(s);
const idx=$('#index'),frame=$('#frame'),fit=$('#fit');
let mode='d', grid=false;
try{mode=localStorage.getItem('wf-mode')||'d';grid=localStorage.getItem('wf-grid')==='1'}catch(e){}
const groups={};PAGES.forEach(p=>(groups[p.g]??=[]).push(p));
idx.innerHTML=`<h1>OrbitFlow</h1><div class="sub">와이어프레임 v2 · ${PAGES.length}개 화면 · 데스크톱/태블릿/모바일</div>`+
  Object.entries(groups).map(([g,ps])=>`<h2>${g}</h2>`+ps.map(p=>`<a data-id="${p.id}">${p.name}<small>${p.path}</small></a>`).join('')).join('');
function scale(){
  frame.style.transform='none';
  const w=fit.clientWidth, s=Math.min(1,w/frame.scrollWidth);
  frame.style.transform=`scale(${s})`;
  fit.style.height=(frame.scrollHeight*s)+'px';
}
function show(id){
  const p=PAGES.find(x=>x.id===id)||PAGES[0];
  frame.className='frame '+({m:'mob',t:'tab',d:'desk'}[mode]);
  frame.innerHTML=mode==='m'?p.m().map(([c,h])=>phone(c,h)).join(''):p.d();
  $('#title').textContent=p.name; $('#path').textContent=p.path;
  idx.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===p.id));
  document.querySelectorAll('#mode span').forEach(s=>s.classList.toggle('on',s.dataset.mode===mode));
  $('#notes').innerHTML=`<h4>구성 메모</h4><ol>${p.notes.filter(([t])=>t).map(([t,d])=>`<li><i class="n">${p.notes.findIndex(x=>x[0]===t)+1}</i><div>${t}${d?`<code>${d}</code>`:''}</div></li>`).join('')}</ol>`+
    (p.q?`<div class="q"><b>확인할 것</b>${p.q.map(x=>`<p>· ${x}</p>`).join('')}</div>`:'');
  if(location.hash.slice(1)!==p.id) history.replaceState(null,'','#'+p.id);
  if(grid) addGrid();
  $('#gridbtn').classList.toggle('p',grid);
  requestAnimationFrame(scale);
  $('.stage').scrollTop=0;
}
function addGrid(){
  const ov=k=>`<div class="gridov">${'<i></i>'.repeat(k)}</div>`;
  if(mode==='m'){frame.querySelectorAll('.phone').forEach(ph=>ph.insertAdjacentHTML('beforeend',ov(4)));return}
  const c=frame.querySelector('.content');
  (c||frame).insertAdjacentHTML('beforeend',ov(mode==='t'?6:12));
}
function toggleGrid(){grid=!grid;try{localStorage.setItem('wf-grid',grid?'1':'0')}catch(e){}show(location.hash.slice(1))}
function setMode(m){mode=m;try{localStorage.setItem('wf-mode',m)}catch(e){}show(location.hash.slice(1))}
idx.addEventListener('click',e=>{const a=e.target.closest('a[data-id]');if(a)show(a.dataset.id)});
$('#gridbtn').addEventListener('click',toggleGrid);
$('#mode').addEventListener('click',e=>{const s=e.target.closest('[data-mode]');if(s)setMode(s.dataset.mode)});
frame.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a&&PAGES.some(p=>p.id===a.dataset.go))show(a.dataset.go)});
document.addEventListener('keydown',e=>{
  const i=PAGES.findIndex(p=>p.id===location.hash.slice(1));
  if(e.key==='ArrowRight')show(PAGES[Math.min(PAGES.length-1,i+1)].id);
  if(e.key==='ArrowLeft')show(PAGES[Math.max(0,i-1)].id);
  if(e.key==='d'||e.key==='D')setMode('d');
  if(e.key==='m'||e.key==='M')setMode('m');
  if(e.key==='t'||e.key==='T')setMode('t');
  if(e.key==='g'||e.key==='G')toggleGrid();
});
window.addEventListener('resize',scale);
document.fonts&&document.fonts.ready.then(scale);
show(location.hash.slice(1)||'layout');
</script>
